[package]
name = "gain"
# Not used: the release build sets the version from the tag (GAIN_VERSION).
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
aws-lc-rs = "1.18.2"
base64 = "0.23.1"
libc = "0.2.191"
scrypt = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Apple's TLS (Security.framework) and the system trust store; no second crypto stack.
ureq = { version = "3.5.0", default-features = false, features = ["native-tls-no-default", "json"] }
zeroize = { version = "1.9.1", features = ["serde"] }

[profile.release]
strip = true

# The vault KDF (scrypt, 128 MiB) takes minutes unoptimized.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
