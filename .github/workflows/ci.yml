name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # the one pinned in rust-toolchain.toml
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest,cargo-audit
      - run: cargo nextest run --locked
      - run: cargo audit
      # The protections README "Why Rust" relies on, on an ad-hoc signed build (release.yml repeats
      # this on the Developer ID signed binary). Developer tools on, so only the hardened runtime
      # can be what stops lldb.
      - name: Security check
        run: |
          cargo build --locked
          codesign -s - -f -o runtime target/debug/gain
          sudo DevToolsSecurity -enable
          scripts/security-check.sh target/debug/gain
