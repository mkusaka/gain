name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # the one pinned in rust-toolchain.toml
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest,cargo-audit
      - run: cargo nextest run --locked
      - run: cargo audit
      # The protections README "Why Rust" relies on, on an ad-hoc signed build (release.yml repeats
      # this on the Developer ID signed binary). SIP is off on these runners, so the lldb and
      # DYLD_INSERT_LIBRARIES checks are skipped with a warning; run them locally (README).
      - name: Security check
        run: |
          cargo build --locked
          codesign -s - -f -o runtime target/debug/gain
          sudo DevToolsSecurity -enable
          scripts/security-check.sh target/debug/gain
      - name: Build Gain.app
        run: |
          scripts/build-app.sh target/debug/gain build
          codesign -s - -f -o runtime build/Gain.app
          codesign --verify --strict --deep build/Gain.app
