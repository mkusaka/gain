name: Release

# Tag v* to publish; run manually to validate building, signing and notarization without publishing.
# Why it is built this way: README "Distribution".
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Never cancel a release half way. "-caller": ci.yml, called from here, sees this github.workflow too.
concurrency:
  group: ${{ github.workflow }}-caller-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: test
    if: github.actor == 'mkusaka'
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Secrets go on the steps that use them, not the job: cargo build runs dependency build scripts.
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No build cache: a poisoned cache would end up in the signed binary.
      - run: rustup toolchain install # the one pinned in rust-toolchain.toml
      - name: Set version
        run: |
          VERSION=0.0.0
          if [[ "$PUBLISH" == "true" ]]; then VERSION=${GITHUB_REF_NAME#v}; fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must be vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Validate secrets
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APPLE_APP_STORE_CONNECT_API_KEY_BASE64 }}
          APPLE_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY_ID }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          required=(APPLE_DEVELOPER_ID_P12_BASE64 APPLE_DEVELOPER_ID_P12_PASSWORD APPLE_KEYCHAIN_PASSWORD
            APPLE_APP_STORE_CONNECT_API_KEY_BASE64 APPLE_APP_STORE_CONNECT_ISSUER_ID APPLE_APP_STORE_CONNECT_KEY_ID)
          if [[ "$PUBLISH" == "true" ]]; then required+=(HOMEBREW_TAP_TOKEN); fi
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done
      - name: Install signing assets
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APPLE_APP_STORE_CONNECT_API_KEY_BASE64 }}
          APPLE_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY_ID }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/gain-signing.keychain-db"
          P12_PATH="$RUNNER_TEMP/developer-id-application.p12"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_APP_STORE_CONNECT_KEY_ID}.p8"
          echo "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$P12_PATH"
          echo "$APPLE_APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "API_KEY_PATH=$API_KEY_PATH"
          } >> "$GITHUB_ENV"
      - name: Build and sign
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            GAIN_VERSION=$VERSION cargo build --locked --release --target "$target"
          done
          mkdir -p build
          # One universal binary: the cask has a single url/sha256.
          lipo -create target/aarch64-apple-darwin/release/gain target/x86_64-apple-darwin/release/gain \
            -output build/gain
          # Hardened runtime and no entitlements, or the agent refuses to run (README "Why Rust").
          codesign --force --options runtime --timestamp \
            --keychain "$KEYCHAIN_PATH" --sign "Developer ID Application" build/gain
          codesign --verify --strict --verbose=2 build/gain
          lipo -archs build/gain | grep -q 'x86_64 arm64'
          codesign -dv --arch x86_64 build/gain 2>&1 | grep -Eq 'flags=0x[0-9a-f]+\([^)]*runtime'
          strings build/gain | grep -qF "$VERSION" # GAIN_VERSION took effect
          # Smoke test the x86_64 slice through Rosetta: parse args and reach for the socket.
          arch -x86_64 build/gain agent status 2>&1 | grep -q "not running"
      # The protections README "Why Rust" relies on, on the binary we ship (lldb/DYLD checks need
      # SIP, which is off on these runners: run the script locally before tagging, README).
      - name: Security check
        run: |
          sudo DevToolsSecurity -enable
          scripts/security-check.sh build/gain
      - name: Notarize
        env:
          APPLE_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY_ID }}
        run: |
          (cd build && zip -q ../notarize.zip gain)
          xcrun notarytool submit notarize.zip \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APPLE_APP_STORE_CONNECT_ISSUER_ID" \
            --timeout 1h --wait
      - name: Package
        run: |
          tar -C build -czf "gain-${VERSION}-darwin-universal.tar.gz" gain
          shasum -a 256 gain-*.tar.gz
      # npm ships the same signed universal binary as its `bin` (README "Distribution").
      - name: Package for npm
        run: |
          mkdir -p npm/bin
          cp build/gain npm/bin/gain
          cp README.md LICENSE npm/
          jq -n --arg version "$VERSION" '{
            name: "@mkusaka/gain", version: $version,
            description: "Run gh with a GitHub App installation token, with the App key held by a passphrase-locked agent.",
            license: "MIT", repository: { type: "git", url: "git+https://github.com/mkusaka/gain.git" },
            bin: { gain: "bin/gain" }, os: ["darwin"], cpu: ["arm64", "x64"]
          }' > npm/package.json
          npm pack --dry-run ./npm
      # The cask lives in this repo (packaging/homebrew/gain.rb); the tap gets the filled-in file.
      - name: Render the Homebrew cask
        shell: bash
        run: |
          sha256=$(shasum -a 256 "gain-$VERSION-darwin-universal.tar.gz" | awk '{print $1}')
          sed -e "s/^  version \".*\"/  version \"$VERSION\"/" -e "s/^  sha256 \".*\"/  sha256 \"$sha256\"/" \
            packaging/homebrew/gain.rb > gain.rb
          grep -qF "version \"$VERSION\"" gain.rb && grep -qF "sha256 \"$sha256\"" gain.rb
          ruby -c gain.rb
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUBLISH == 'true'
        with:
          subject-path: gain-*.tar.gz
      - name: Publish GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" gain-*.tar.gz \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "gain $GITHUB_REF_NAME" --generate-notes
      - name: Update Homebrew tap
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          current=$(gh api repos/mkusaka/homebrew-tap/contents/Casks/gain.rb --jq .sha)
          gh api -X PUT repos/mkusaka/homebrew-tap/contents/Casks/gain.rb \
            -f message="bump gain to $VERSION" -f content="$(base64 -i gain.rb)" -f sha="$current"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.PUBLISH == 'true'
        with:
          node-version: 26
          package-manager-cache: false
      # Trusted publishing (OIDC, id-token: write): no npm token; provenance is attached.
      - name: Publish to npm
        if: env.PUBLISH == 'true'
        run: npm publish ./npm --provenance --access public
      - name: Cleanup signing assets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/developer-id-application.p12 "$RUNNER_TEMP"/AuthKey_*.p8
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
